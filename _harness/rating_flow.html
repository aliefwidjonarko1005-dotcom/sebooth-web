          <!-- Good Face: pleasant happy smile -->
          <circle cx="32" cy="32" r="28" fill="#F0FDF4" stroke="#30D158" stroke-width="3"/>
          <circle cx="22" cy="27" r="3.5" fill="#30D158"/>
          <circle cx="42" cy="27" r="3.5" fill="#30D158"/>
          <path d="M21 38 Q32 48 43 38" stroke="#30D158" stroke-width="4" stroke-linecap="round" fill="none"/>
        `
      },
      5: {
        title: "KEREN BANGET!",
        subtitle: "Sangat Puas & Menyenangkan",
        color: "#FF5500",
        borderClass: "border-brand",
        bgLight: "bg-brand-50",
        textClass: "text-brand",
        angle: 72,
        faceSvg: `
          <!-- Awesome Face: beaming smile with glowing star eyes & big open smile -->
          <circle cx="32" cy="32" r="28" fill="#FFF5EB" stroke="#FF5500" stroke-width="3.5"/>
          <!-- Star/Excited Eyes -->
          <circle cx="23" cy="26" r="4" fill="#FF5500"/>
          <circle cx="41" cy="26" r="4" fill="#FF5500"/>
          <!-- Radiant Big Laugh / Smile -->
          <path d="M20 37 Q32 52 44 37 Z" fill="#FF5500" stroke="#FF5500" stroke-width="2" stroke-linejoin="round"/>
        `
      }
    };

    let currentRating = 5;

    function setRating(level) {
      currentRating = level;
      const data = moodLevels[level];

      // Update face container border & icon
      const faceContainer = document.getElementById('face-container');
      const faceIcon = document.getElementById('face-icon');
      const sentimentLabel = document.getElementById('sentiment-label');
      const sentimentSub = document.getElementById('sentiment-subtext');
      const needle = document.getElementById('gauge-needle');
      const indicatorPill = document.getElementById('needle-indicator-pill');

      // Update text
      sentimentLabel.innerText = data.title;
      sentimentLabel.style.color = data.color;
      sentimentSub.innerText = data.subtitle;

      // Update Face
      faceContainer.style.borderColor = data.color;
      faceIcon.innerHTML = data.faceSvg;

      // Needle Rotation Angle
      needle.style.transform = `rotate(${data.angle}deg)`;
      indicatorPill.style.backgroundColor = data.color;

      // Update bottom segmented pills state
      for (let i = 1; i <= 5; i++) {
        const pill = document.getElementById(`pill-${i}`);
        if (i === level) {
          pill.className = `py-1.5 flex flex-col items-center rounded-xl text-[11px] font-bold transition-all ${data.bgLight} ${data.textClass} shadow-sm border border-current`;
        } else {
          pill.className = "py-1.5 flex flex-col items-center rounded-xl text-[11px] font-bold transition-all text-slate-400 hover:bg-slate-50";
        }
      }
    }

    // Toggle multi-select tags
    function toggleChip(button) {
      const isSelected = button.classList.contains('active-chip');
      if (isSelected) {
        button.classList.remove('active-chip', 'bg-brand-50', 'border-brand/30', 'text-brand');
        button.classList.add('bg-white', 'border-slate-200', 'text-slate-700');
      } else {
        button.classList.add('active-chip', 'bg-brand-50', 'border-brand/30', 'text-brand');
        button.classList.remove('bg-white', 'border-slate-200', 'text-slate-700');
      }
    }

    // Submission handler
    function handleSubmit() {
      const btn = document.getElementById('submit-btn');
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span>Mengirim...</span>
      `;
      
      setTimeout(() => {
        btn.innerHTML = `
          <span>Terkirim! Terima kasih ✨</span>
        `;
        btn.classList.remove('bg-brand', 'hover:bg-brand-600');
        btn.classList.add('bg-emerald-500');
      }, 900);
    }

    // Initial render setup
    document.addEventListener('DOMContentLoaded', () => {
      setRating(5);
    });
  </script>
<!-- END: InteractiveScripts -->
</body></html>

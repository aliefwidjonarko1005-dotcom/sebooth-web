<script>
  // 5 Rating Moods Definition exactly corresponding to Reference Image Style
  const moods = [
    {
      id: 0,
      title: "BURUK",
      sub: "Maaf atas pengalaman kurang baikmu",
      color: "#FF3855",
      lightColor: "#FFF0F2",
      btnShadow: "0 10px 25px -4px rgba(255, 56, 85, 0.45)",
      // Angry face
      faceSvg: `
        <circle cx="80" cy="80" r="72" stroke="#FF3855" stroke-width="7" fill="#FFF0F2" />
        <ellipse cx="54" cy="62" rx="7" ry="9" fill="#FF3855" transform="rotate(15 54 62)" />
        <ellipse cx="106" cy="62" rx="7" ry="9" fill="#FF3855" transform="rotate(-15 106 62)" />
        <path d="M46 48 L64 56" stroke="#FF3855" stroke-width="5" stroke-linecap="round" />
        <path d="M114 48 L96 56" stroke="#FF3855" stroke-width="5" stroke-linecap="round" />
        <path d="M52 114 Q80 84 108 114" stroke="#FF3855" stroke-width="7" stroke-linecap="round" fill="none" />
      `
    },
    {
      id: 1,
      title: "KURANG",
      sub: "Beri tahu kami apa yang bisa diperbaiki",
      color: "#FFA845",
      lightColor: "#FFF8ED",
      btnShadow: "0 10px 25px -4px rgba(255, 168, 69, 0.45)",
      // Skeptical / ugh face
      faceSvg: `
        <circle cx="80" cy="80" r="72" stroke="#FFA845" stroke-width="7" fill="#FFF8ED" />
        <ellipse cx="56" cy="62" rx="7" ry="8" fill="#FFA845" />
        <ellipse cx="104" cy="62" rx="7" ry="8" fill="#FFA845" />
        <path d="M48 48 Q60 42 70 48" stroke="#FFA845" stroke-width="4.5" stroke-linecap="round" fill="none" />
        <path d="M90 48 Q100 42 112 48" stroke="#FFA845" stroke-width="4.5" stroke-linecap="round" fill="none" />
        <path d="M54 108 C68 94 92 116 106 102" stroke="#FFA845" stroke-width="7" stroke-linecap="round" fill="none" />
      `
    },
    {
      id: 2,
      title: "CUKUP",
      sub: "Sesi standar tanpa kendala berarti",
      color: "#24B2FF",
      lightColor: "#EDF8FF",
      btnShadow: "0 10px 25px -4px rgba(36, 178, 255, 0.45)",
      // Neutral face
      faceSvg: `
        <circle cx="80" cy="80" r="72" stroke="#24B2FF" stroke-width="7" fill="#EDF8FF" />
        <circle cx="56" cy="65" r="8" fill="#24B2FF" />
        <circle cx="104" cy="65" r="8" fill="#24B2FF" />
        <line x1="52" y1="108" x2="108" y2="108" stroke="#24B2FF" stroke-width="7" stroke-linecap="round" />
      `
    },
    {
      id: 3,
      title: "BAGUS",
      sub: "Hasil foto ceria & memuaskan!",
      color: "#22D48B",
      lightColor: "#EDFDF6",
      btnShadow: "0 10px 25px -4px rgba(34, 212, 139, 0.45)",
      // Happy smile face
      faceSvg: `
        <circle cx="80" cy="80" r="72" stroke="#22D48B" stroke-width="7" fill="#EDFDF6" />
        <ellipse cx="56" cy="64" rx="8" ry="9" fill="#22D48B" />
        <ellipse cx="104" cy="64" rx="8" ry="9" fill="#22D48B" />
        <path d="M50 96 Q80 134 110 96" stroke="#22D48B" stroke-width="7" stroke-linecap="round" fill="none" />
      `
    },
    {
      id: 4,
      title: "KEREN!",
      sub: "Luar biasa seru & sangat puas!",
      color: "#FF5500",
      lightColor: "#FFF5EB",
      btnShadow: "0 10px 25px -4px rgba(255, 85, 0, 0.45)",
      // Super excited big smile face
      faceSvg: `
        <circle cx="80" cy="80" r="72" stroke="#FF5500" stroke-width="7" fill="#FFF5EB" />
        <circle cx="54" cy="60" r="9" fill="#FF5500" />
        <circle cx="106" cy="60" r="9" fill="#FF5500" />
        <path d="M46 92 Q80 142 114 92 Z" fill="#FF5500" stroke="#FF5500" stroke-width="4" stroke-linejoin="round" />
      `
    }
  ];

  // Wheel configuration: 5 sectors = 42 degrees visible width per wedge on the arch
  // We arrange sectors circularly on the 360-deg wheel.
  // Sector step angle:
  const sectorStep = 45; // 45 deg each sector for crisp readable spacing
  let activeIndex = 4; // Start at KEREN!

  // Build the SVG Roulette sectors
  const svgGroup = document.getElementById('wheel-wedges-group');
  const cx = 300, cy = 300, rOuter = 290, rInner = 175;

  function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
    const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
    return {
      x: centerX + (radius * Math.cos(angleInRadians)),
      y: centerY + (radius * Math.sin(angleInRadians))
    };
  }

  function describeRingSector(x, y, innerRadius, outerRadius, startAngle, endAngle) {
    const p1 = polarToCartesian(x, y, outerRadius, startAngle);
    const p2 = polarToCartesian(x, y, outerRadius, endAngle);
    const p3 = polarToCartesian(x, y, innerRadius, endAngle);
    const p4 = polarToCartesian(x, y, innerRadius, startAngle);
    const largeArc = endAngle - startAngle <= 180 ? 0 : 1;

    return [
      "M", p1.x, p1.y,
      "A", outerRadius, outerRadius, 0, largeArc, 1, p2.x, p2.y,
      "L", p3.x, p3.y,
      "A", innerRadius, innerRadius, 0, largeArc, 0, p4.x, p4.y,
      "Z"
    ].join(" ");
  }

  // Generate wedges centered around top (0 deg)
  // Indices 0, 1, 2, 3, 4
  const sectorColors = [
    "#FF3855", // BURUK
    "#FFA845", // KURANG
    "#24B2FF", // CUKUP
    "#22D48B", // BAGUS
    "#FF5500"  // KEREN!
  ];

  function renderWheel() {
    let html = '';
    for (let i = 0; i < 5; i++) {
      // Each wedge centered at i * sectorStep
      const centerAngle = i * sectorStep;
      const startAngle = centerAngle - (sectorStep / 2);
      const endAngle = centerAngle + (sectorStep / 2);
      const pathD = describeRingSector(cx, cy, rInner, rOuter, startAngle, endAngle);
      
      // Calculate text position
      const textPos = polarToCartesian(cx, cy, (rInner + rOuter) / 2, centerAngle);
      
      html += `
        <g class="cursor-pointer" onclick="selectMood(${i})">
          <path d="${pathD}" fill="${sectorColors[i]}" stroke="#ffffff" stroke-width="1.5" />
          
          <!-- Tick Marks on Outer & Inner Rim -->
          ${(() => {
            let ticks = '';
            for (let t = -18; t <= 18; t += 6) {
              const pOuter = polarToCartesian(cx, cy, rOuter - 2, centerAngle + t);
              const pOuterIn = polarToCartesian(cx, cy, rOuter - 9, centerAngle + t);
              ticks += `<line x1="${pOuter.x}" y1="${pOuter.y}" x2="${pOuterIn.x}" y2="${pOuterIn.y}" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>`;
            }
            return ticks;
          })()}
          
          <!-- Mood Label on Arc -->
          <text 
            x="${textPos.x}" 
            y="${textPos.y + 4}" 
            fill="#ffffff" 
            font-size="16" 
            font-weight="800" 
            letter-spacing="0.06em"
            text-anchor="middle" 
            transform="rotate(${centerAngle}, ${textPos.x}, ${textPos.y})">
            ${moods[i].title}
          </text>
        </g>
      `;
    }
    svgGroup.innerHTML = html;
  }

  renderWheel();

  // Roulette rotation logic
  const wheel = document.getElementById('roulette-wheel');
  const moodTitle = document.getElementById('mood-title');
  const moodSubtitle = document.getElementById('mood-subtitle');
  const faceContainer = document.getElementById('emoji-face-container');
  const faceSvg = document.getElementById('emoji-face-svg');
  const submitBtn = document.getElementById('submit-btn');

  function updateActiveUI(idx) {
    const data = moods[idx];
    
    // Smoothly rotate the wheel so the selected wedge is exactly at top (0 deg)
    const targetAngle = -(idx * sectorStep);
    wheel.style.transform = `rotate(${targetAngle}deg)`;

    // Update Title & Subtitle
    moodTitle.innerText = data.title;
    moodTitle.style.color = data.color;
    moodSubtitle.innerText = data.sub;

    // Update Emoji Face with pop bounce
    faceSvg.innerHTML = data.faceSvg;
    faceContainer.classList.remove('face-pop');
    void faceContainer.offsetWidth; // trigger reflow
    faceContainer.classList.add('face-pop');

    // Update Submit Button style
    submitBtn.style.backgroundColor = data.color;
    submitBtn.style.boxShadow = data.btnShadow;
  }

  function selectMood(idx) {
    if (idx < 0) idx = 0;
    if (idx > 4) idx = 4;
    activeIndex = idx;
    updateActiveUI(activeIndex);
  }

  // Interactive Drag & Touch Swipe support
  let isDragging = false;
  let startX = 0;
  let currentRotation = -(activeIndex * sectorStep);

  const touchArea = document.getElementById('touch-area');

  function handleStart(clientX) {
    isDragging = true;
    startX = clientX;
    wheel.classList.add('dragging');
    currentRotation = -(activeIndex * sectorStep);
  }

  function handleMove(clientX) {
    if (!isDragging) return;
    const deltaX = clientX - startX;
    // Map horizontal swipe distance (px) to rotation degree
    // Moving finger right rotates wheel counter-clockwise (revealing lower index), etc.
    const degDelta = deltaX * 0.22;
    let computedRotation = currentRotation + degDelta;
    
    // Bounds resistance
    if (computedRotation > 15) computedRotation = 15;
    if (computedRotation < -(4 * sectorStep + 15)) computedRotation = -(4 * sectorStep + 15);

    wheel.style.transform = `rotate(${computedRotation}deg)`;

    // Calculate closest index preview
    let estimatedIdx = Math.round(-computedRotation / sectorStep);
    if (estimatedIdx < 0) estimatedIdx = 0;
    if (estimatedIdx > 4) estimatedIdx = 4;

    if (estimatedIdx !== activeIndex) {
      activeIndex = estimatedIdx;
      // Quick live preview update of labels & face
      const data = moods[activeIndex];
      moodTitle.innerText = data.title;
      moodTitle.style.color = data.color;
      moodSubtitle.innerText = data.sub;
      faceSvg.innerHTML = data.faceSvg;
      submitBtn.style.backgroundColor = data.color;
      submitBtn.style.boxShadow = data.btnShadow;
    }
  }

  function handleEnd() {
    if (!isDragging) return;
    isDragging = false;
    wheel.classList.remove('dragging');
    // Snap cleanly to active index
    updateActiveUI(activeIndex);
  }

  // Touch Listeners
  touchArea.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientX), { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (isDragging) handleMove(e.touches[0].clientX);
  }, { passive: true });
  window.addEventListener('touchend', handleEnd);

  // Mouse Listeners for Desktop simulation
  touchArea.addEventListener('mousedown', (e) => handleStart(e.clientX));
  window.addEventListener('mousemove', (e) => {
    if (isDragging) handleMove(e.clientX);
  });
  window.addEventListener('mouseup', handleEnd);

  // Submit Handler
  function handleSubmit() {
    submitBtn.disabled = true;
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = `
      <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
    `;
    setTimeout(() => {
      submitBtn.innerHTML = "TERKIRIM! ✨";
      setTimeout(() => {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }, 1800);
    }, 800);
  }

  // Initial load
  updateActiveUI(4);
</script>

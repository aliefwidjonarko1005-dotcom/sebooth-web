  // Wheel configuration: 5 sectors
  // sectorStep = 45 degrees
  // Index 0: 0 deg (BURUK)
  // Index 1: 45 deg (KURANG)
  // Index 2: 90 deg (CUKUP)
  // Index 3: 135 deg (BAGUS)
  // Index 4: 180 deg (KEREN!)
  const sectorStep = 45;
  let activeIndex = 4; // Default starting at KEREN!

  const svgGroup = document.getElementById('wheel-wedges-group');
  const cx = 320, cy = 320, rOuter = 295, rInner = 185;

  function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
    const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
    return {
      x: centerX + (radius * Math.cos(angleInRadians)),
      y: centerY + (radius * Math.sin(angleInRadians))
    };
  }

  function describeRingSector(x, y, innerRadius, outerRadius, startAngle, endAngle) {
    const p1 = polarToCartesian(x, y, outerRadius, startAngle);
    const p2 = polarToCartesian(x, y, outerRadius, endAngle);
    const p3 = polarToCartesian(x, y, innerRadius, endAngle);
    const p4 = polarToCartesian(x, y, innerRadius, startAngle);
    const largeArc = (endAngle - startAngle) % 360 <= 180 ? 0 : 1;

    return [
      "M", p1.x, p1.y,
      "A", outerRadius, outerRadius, 0, largeArc, 1, p2.x, p2.y,
      "L", p3.x, p3.y,
      "A", innerRadius, innerRadius, 0, largeArc, 0, p4.x, p4.y,
      "Z"
    ].join(" ");
  }

  function renderWheel() {
    let html = '';
    for (let i = 0; i < 5; i++) {
      const centerAngle = i * sectorStep;
      const startAngle = centerAngle - (sectorStep / 2);
      const endAngle = centerAngle + (sectorStep / 2);
      const pathD = describeRingSector(cx, cy, rInner, rOuter, startAngle, endAngle);
      const textPos = polarToCartesian(cx, cy, (rInner + rOuter) / 2 + 3, centerAngle);

      html += `
        <g id="sector-${i}" class="cursor-pointer transition-opacity duration-200" onclick="selectMood(${i})">
          <path d="${pathD}" fill="${moods[i].color}" stroke="#ffffff" stroke-width="2.5" />
          
          <!-- Outer and Inner tick marks -->
          ${(() => {
            let ticks = '';
            for (let t = -16; t <= 16; t += 8) {
              const pOuter = polarToCartesian(cx, cy, rOuter - 3, centerAngle + t);
              const pOuterIn = polarToCartesian(cx, cy, rOuter - 10, centerAngle + t);
              ticks += `<line x1="${pOuter.x}" y1="${pOuter.y}" x2="${pOuterIn.x}" y2="${pOuterIn.y}" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-linecap="round"/>`;
            }
            return ticks;
          })()}
          
          <!-- Mood Label with readable uppercase typography -->
          <text 
            id="sector-text-${i}"
            x="${textPos.x}" 
            y="${textPos.y + 5}" 
            fill="#ffffff" 
            font-size="16" 
            font-weight="800" 
            letter-spacing="0.08em"
            text-anchor="middle" 
            transform="rotate(${centerAngle}, ${textPos.x}, ${textPos.y})">
            ${moods[i].title}
          </text>
        </g>
      `;
    }
    svgGroup.innerHTML = html;
  }

  renderWheel();

  const wheel = document.getElementById('roulette-wheel');
  const wheelWrapper = document.getElementById('wheel-wrapper');
  const moodTitle = document.getElementById('mood-title');
  const moodSubtitle = document.getElementById('mood-subtitle');
  const faceContainer = document.getElementById('emoji-face-container');
  const faceSvg = document.getElementById('emoji-face-svg');
  const submitBtn = document.getElementById('submit-btn');
  const indicatorPin = document.getElementById('indicator-pin');

  let currentAngle = -(activeIndex * sectorStep);

  function highlightSector(idx) {
    for (let i = 0; i < 5; i++) {
      const g = document.getElementById(`sector-${i}`);
      const t = document.getElementById(`sector-text-${i}`);
      if (g && t) {
        if (i === idx) {
          g.style.opacity = '1';
          t.setAttribute('font-size', '17');
          t.setAttribute('font-weight', '900');
        } else {
          g.style.opacity = '0.78';
          t.setAttribute('font-size', '15');
          t.setAttribute('font-weight', '700');
        }
      }
    }
  }

  function updateActiveUI(idx, animated = true) {
    const data = moods[idx];

    // Animate or snap wheel angle
    currentAngle = -(idx * sectorStep);
    wheel.classList.remove('wheel-free');
    if (animated) {
      wheel.classList.add('wheel-snap-transition');
    } else {
      wheel.classList.remove('wheel-snap-transition');
    }
    wheel.style.transform = `rotate(${currentAngle}deg)`;

    // Update Text
    moodTitle.innerText = data.title;
    moodTitle.style.color = data.color;
    moodSubtitle.innerText = data.sub;

    // Update Face
    faceSvg.innerHTML = data.faceSvg;
    faceContainer.classList.remove('face-pop');
    void faceContainer.offsetWidth; // retrigger animation
    faceContainer.classList.add('face-pop');

    // Update Submit Button
    submitBtn.style.backgroundColor = data.color;
    submitBtn.style.boxShadow = data.btnShadow;

    // Sector highlighted in wheel
    highlightSector(idx);

    // Subtle needle bounce
    indicatorPin.style.transform = 'scale(1.15) translateY(-2px)';
    setTimeout(() => {
      indicatorPin.style.transform = 'scale(1) translateY(0px)';
    }, 160);
  }

  function selectMood(idx) {
    if (idx < 0) idx = 0;
    if (idx > 4) idx = 4;
    activeIndex = idx;
    updateActiveUI(activeIndex, true);
  }

  // Real Drag & Swipe Gesture Handling with Pointer Events
  let isPointerDown = false;
  let startX = 0;
  let startY = 0;
  let startAngle = 0;
  let lastMoveTime = 0;
  let lastMoveAngle = 0;
  let velocityAngle = 0;

  function onPointerDown(e) {
    isPointerDown = true;
    startX = e.clientX;
    startY = e.clientY;
    startAngle = currentAngle;
    lastMoveAngle = currentAngle;
    lastMoveTime = performance.now();
    velocityAngle = 0;

    wheel.classList.remove('wheel-snap-transition');
    wheel.classList.add('wheel-free');
    wheelWrapper.setPointerCapture?.(e.pointerId);
  }

  function onPointerMove(e) {
    if (!isPointerDown) return;

    const deltaX = e.clientX - startX;
    
    // Scale delta pixels to wheel angle rotation
    // Swiping right rotates clockwise, swiping left rotates counter-clockwise
    const sensitivity = 0.28;
    let newAngle = startAngle + (deltaX * sensitivity);

    // Elastic resistance bounds (index 0 is 0 deg, index 4 is -180 deg)
    const maxBound = 16;
    const minBound = -(4 * sectorStep + 16);

    if (newAngle > maxBound) {
      newAngle = maxBound + (newAngle - maxBound) * 0.25;
    } else if (newAngle < minBound) {
      newAngle = minBound + (newAngle - minBound) * 0.25;
    }

    currentAngle = newAngle;
    wheel.style.transform = `rotate(${currentAngle}deg)`;

    // Calculate velocity for inertia release
    const now = performance.now();
    const dt = now - lastMoveTime;
    if (dt > 10) {
      velocityAngle = (newAngle - lastMoveAngle) / dt; // deg per ms
      lastMoveTime = now;
      lastMoveAngle = newAngle;
    }

    // Dynamic realtime preview of nearest mood
    let estIdx = Math.round(-currentAngle / sectorStep);
    if (estIdx < 0) estIdx = 0;
    if (estIdx > 4) estIdx = 4;

    if (estIdx !== activeIndex) {
      activeIndex = estIdx;
      const data = moods[activeIndex];
      moodTitle.innerText = data.title;
      moodTitle.style.color = data.color;
      moodSubtitle.innerText = data.sub;
      faceSvg.innerHTML = data.faceSvg;
      submitBtn.style.backgroundColor = data.color;
      submitBtn.style.boxShadow = data.btnShadow;
      highlightSector(activeIndex);

      // Subtle indicator twitch following drag direction
      const tilt = Math.max(-12, Math.min(12, deltaX * 0.1));
      indicatorPin.style.transform = `rotate(${tilt}deg)`;
    }
  }

  function onPointerUp(e) {
    if (!isPointerDown) return;
    isPointerDown = false;
    wheelWrapper.releasePointerCapture?.(e.pointerId);

    // Apply inertia based on velocity
    let projectedAngle = currentAngle + (velocityAngle * 120);
    let targetIdx = Math.round(-projectedAngle / sectorStep);
    if (targetIdx < 0) targetIdx = 0;
    if (targetIdx > 4) targetIdx = 4;

    activeIndex = targetIdx;
    updateActiveUI(activeIndex, true);
    indicatorPin.style.transform = 'rotate(0deg)';
  }

  wheelWrapper.addEventListener('pointerdown', onPointerDown);
  wheelWrapper.addEventListener('pointermove', onPointerMove);
  wheelWrapper.addEventListener('pointerup', onPointerUp);
  wheelWrapper.addEventListener('pointercancel', onPointerUp);

  // Submit Feedback Handler
  function handleSubmit() {
    submitBtn.disabled = true;
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = `
      <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
    `;
    setTimeout(() => {
      submitBtn.innerHTML = "TERKIRIM! ✨";
      setTimeout(() => {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }, 1800);
    }, 700);
  }

  // Initial setup: Default to KEREN! (index 4)
  updateActiveUI(4, false);
</script>
